<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BrankasKu</title>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }
  .card {
    background: #262626;
    padding: 24px;
    border-radius: 12px;
    width: 260px;
  }
  h2 { margin-top: 0; text-align: center; }
  label { font-size: 14px; color: #aaa; }
  input {
    width: 100%;
    padding: 8px;
    margin: 6px 0 14px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #333;
    color: #eee;
  }
  button {
    width: 100%;
    padding: 9px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  #saveBtn { background: #d99a44; }
  #cookieBtn { background: #444; color: #eee; }
  #clearBtn { background: #663333; color: #eee; }
</style>
</head>
<body>

<div class="card">
  <h2>🍪 BrankasKu</h2>
    <label for="firstText">Username</label>
    <input type="text" id="firstText">

    <label for="lastText">Password</label>
    <input type="password" id="lastText">

    <button id="saveBtn">Simpan</button>
    <button id="cookieBtn">Cookie</button>
    <button id="clearBtn">Hapus cookie</button>
</div>

<script>
const firstText = document.querySelector("#firstText");
const lastText = document.querySelector("#lastText");
const saveBtn = document.querySelector("#saveBtn");
const cookieBtn = document.querySelector("#cookieBtn");
const clearBtn = document.querySelector("#clearBtn");

saveBtn.addEventListener("click", () => {
    setCookie("firstName", firstText.value, 365);
    setCookie("lastName", lastText.value, 365);
    alert("Tersimpan");
    firstText.value = "";
    lastText.value = "";
});

cookieBtn.addEventListener("click", () => {
    firstText.value = getCookie("firstName") || "";
    lastText.value = getCookie("lastName") || "";
    if (firstText.value === "" && lastText.value === ""){
        alert("Brankas kosong");
    }
});

clearBtn.addEventListener("click", () => {
    deleteCookie("firstName");
    deleteCookie("lastName");
    alert("Cookie berhasil di hapus");
    firstText.value = "";
    lastText.value = "";
});

function setCookie(name, value, daysToLive){
    const date = new Date();
    date.setTime(date.getTime() + (daysToLive * 24 * 60 * 60 * 1000));
    const expires = "expires=" + date.toUTCString();
    document.cookie = `${name}=${encodeURIComponent(value)}; ${expires}; path=/`;
}

function deleteCookie(name){
    setCookie(name, "", -1);
}

function getCookie(name) {
    const cDecoded = decodeURIComponent(document.cookie);
    const cArray = cDecoded.split("; ");
    let result = null;
    
    cArray.forEach(element => {
        if (element.startsWith(name + "=")) {
            result = element.substring(name.length + 1); 
        }
    });
    
    return result;
}

</script>

</body>
</html>
